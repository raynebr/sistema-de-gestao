<app-sidebar>
  <div class="page">
    <div class="page-header">
      <div>
        <h1>Clientes</h1>
        <p>Gerencie a base de clientes da loja</p>
      </div>
      <button class="btn-primary" (click)="mostrarForm = !mostrarForm">
        {{ mostrarForm ? 'Cancelar' : '+ Novo Cliente' }}
      </button>
    </div>

    <div class="form-panel" *ngIf="mostrarForm">
      <div class="form-row">
        <input type="text" placeholder="Nome" [(ngModel)]="novoCliente.nome" />
        <input type="text" placeholder="Telefone" [(ngModel)]="novoCliente.telefone" />
      </div>
      <div class="form-row">
        <input type="email" placeholder="Email" [(ngModel)]="novoCliente.email" />
        <input type="text" placeholder="Cidade" [(ngModel)]="novoCliente.cidade" />
      </div>
      <button class="btn-primary" (click)="salvar()">Salvar Cliente</button>
    </div>

    <input class="busca" type="text" placeholder="Buscar por nome ou cidade..." [(ngModel)]="busca" />

    <table class="tabela" *ngIf="clientesFiltrados.length; else vazio">
      <thead>
        <tr>
          <th>Nome</th>
          <th>Telefone</th>
          <th>Email</th>
          <th>Cidade</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let cliente of clientesFiltrados">
          <td>{{ cliente.nome }}</td>
          <td>{{ cliente.telefone }}</td>
          <td>{{ cliente.email }}</td>
          <td>{{ cliente.cidade }}</td>
          <td><button class="btn-remover" (click)="remover(cliente.id)">Remover</button></td>
        </tr>
      </tbody>
    </table>

    <ng-template #vazio>
      <p class="empty-state">Nenhum cliente encontrado.</p>
    </ng-template>
  </div>
</app-sidebar>
